<!DOCTYPE html>
<html lang="en">    
    <head>        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WeatherNow</title>

        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">

        <script src="https://kit.fontawesome.com/07f0022401.js" crossorigin="anonymous"></script>

    </head>

    <body>
        <main class="main-container">
            <header class="input-bar">
                <input class="city-input" type="text" placeholder="Search City">
                <button class="search">
                    <i class="fa-solid fa-magnifying-glass fa-2x" style="color: #cd853f;"></i>
                </button>
            </header>

            <section class="weather-info" style="display: none;">
                <div class="location-date-box">
                    <div class="location">
                        <i class="fa-solid fa-location-dot" style="color: #cd853f;"></i>

                        <h4 class="citynow">Pune</h4>
                    </div>
                    <h5 class="current-date regular-txt">Thu, 10 Oct</h5>
                </div>

                <div class="weather-summary-container">
                    <img src="assests/weather/cloud-solid.svg" class="weather-summary-img">
                    <div class="weather-summary-info">
                        <h1 class="temptext">29°C</h1>
                        <h3 class="conditiontext regular-txt">Cloudy</h3>
                    </div>
                </div>

                <div class="weather-conditions-container">
                    <div class="condition-items">
                        <i class="fa-solid fa-droplet fa-2x" style="color: rgb(245, 245, 220);"></i>

                        <div class="condition-info">
                            <h5 class="regular-txt">Humidity</h5>
                            <h5 class="humidity-value-txt">72%</h5>
                        </div>
                    </div>

                    <div class="condition-items">
                        <i class="fa-solid fa-wind fa-2x" style="color: #f5f5dc;"></i>

                        <div class="condition-info">
                            <h5 class="regular-txt">Wind Speed</h5>
                            <h5 class="wind-value-txt">16km/h</h5>
                        </div>
                    </div>
                </div>

                <div class="forecast-items-container">
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">11 Oct</h5>
                        <img src="assests/weather/cloud-showers-water-solid.svg" class="weather-summary-img">
                        <h5 class="forecast-item-temp">30°C</h5>
                    </div>

                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">12 Oct</h5>
                        <img src="assests/weather/cloud-showers-water-solid.svg" class="weather-summary-img">
                        <h5 class="forecast-item-temp">30°C</h5>
                    </div>

                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">13 Oct</h5>
                        <img src="assests/weather/cloud-showers-water-solid.svg" class="weather-summary-img">
                        <h5 class="forecast-item-temp">30°C</h5>
                    </div>

                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">14 Oct</h5>
                        <img src="assests/weather/cloud-showers-water-solid.svg" class="weather-summary-img">
                        <h5 class="forecast-item-temp">30°C</h5>
                    </div>

                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">15 Oct</h5>
                        <img src="assests/weather/cloud-showers-water-solid.svg" class="weather-summary-img">
                        <h5 class="forecast-item-temp">30°C</h5>
                    </div>
                </div>
            </section>

            <section class="search-city section-message">
                <img class="message-img" src="assests/searching.png">
                
                <div>
                    <h1>Search City</h1>
                    <h4 class="regular-txt">Find out the weather conditions in a city.</h4>
                </div>
            </section>

            <section class="error-section section-message" style="display: none;">
                <img class="message-img" src="assests/404error.webp">
                
                <div>
                    <h1>Oops!</h1>
                    <h4 class="regular-txt">Looks like you entered a city that does not exist.</h4>
                </div>
            </section>
        </main>
    </body>
</html>
